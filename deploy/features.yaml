features:
  emailChange:
    enabled: false

  phoneChange:
    enabled: false

  usernameChange:
    enabled: false

  mfa:
    totp:
      enabled: true
    backupCodes:
      enabled: true
    webAuthn:
      enabled: true

  passkey:
    enabled: true

  socialIdentities:
    enabled: true
    config:
      # 说明：connectors 支持按配置扩展，不限制为示例里的平台。只要在 Logto 中创建了对应 social connector，并把 connectorId 填在这里即可。
      # 补充：受限于个人精力，实际只对GitHub和QQ连接器进行了测试，如果其他平台有问题欢迎提 issue.
      # target 建议与 Logto connector 的 target 保持一致（如 google/github/qq/wechat/discord/...）。
      connectors:
        - target: google
          connectorId: fs1x8tkij0me0hnul4b6r
          enabled: true
          displayName: Google
          icon: google
          description: Google login
        - target: discord
          connectorId: 5igch1uior30c6f2q2fho
          enabled: true
          displayName: Discord
          icon: discord
          description: Discord
        - target: ely.by
          connectorId: a6j7hq2lwp9j87qhdw22h
          enabled: true
          displayName: ely.by
          icon: web
          description: ely.by Minecraft skins

        # 下面是更多平台示例（按需启用）
        # - target: apple
        #   connectorId: logto_apple_connector_id
        #   enabled: false
        #   displayName: Apple
        #   icon: apple
        #   description: 绑定 Apple 账号
        #
        # - target: discord
        #   connectorId: logto_discord_connector_id
        #   enabled: false
        #   displayName: Discord
        #   icon: discord
        #   description: 绑定 Discord 账号
        #
        # - target: wechat
        #   connectorId: logto_wechat_connector_id
        #   enabled: false
        #   displayName: 微信
        #   icon: wechat
        #   description: 绑定微信账号

  sessions:
    enabled: true

  accountDeletion:
    enabled: true

profileFields:
  avatar:
    enabled: true
    label: Avatar
    description: Profile picture URL
    placeholder: https://example.com/avatar.jpg
    inputType: url

  name:
    enabled: true
    label: Display name
    description: Name
    placeholder: User
    inputType: text
    required: true

  birthdate:
    enabled: false
    label: Birthdate
    description: Birthday date
    inputType: date

  zoneinfo:
    enabled: false
    label: Region
    description: Your region
    placeholder: Asia/Shanghai
    inputType: text

  locale:
    enabled: false
    label: Locale
    description: Language and region
    placeholder: en-US
    inputType: text

  website:
    enabled: false
    label: 个人网站
    description: 您的个人主页链接
    placeholder: https://example.com
    inputType: url
